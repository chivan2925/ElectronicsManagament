spring:
  application:
    name: electronics

  # 1. Database Connection
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/electronics_management}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  # 2. Hibernate
  jpa:
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
    # database-platform: org.hibernate.dialect.PostgreSQLDialect

  # 3. Upload Image
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

# 3. JWT
electronics:
  app:
    jwtSecret: ${ELECTRONICS_JWT_SECRET:dev-only-change-me-minimum-32-bytes}
    jwtExpirationMs: ${ELECTRONICS_JWT_EXPIRATION_MS:86400000}

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

# 4. Payment Integration
payment:
  frontend:
    success-url: ${PAYMENT_FRONTEND_SUCCESS_URL:http://localhost:5173/payment/success}
    failed-url: ${PAYMENT_FRONTEND_FAILED_URL:http://localhost:5173/payment/failed}
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:YOUR_TMN_CODE}
    secret-key: ${VNPAY_SECRET_KEY:YOUR_SECRET_KEY}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    refund-url: ${VNPAY_REFUND_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
    return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/payments/vnpay-return}
  momo:
    partner-code: ${MOMO_PARTNER_CODE:MOMO_PARTNER_CODE}
    access-key: ${MOMO_ACCESS_KEY:MOMO_ACCESS_KEY}
    secret-key: ${MOMO_SECRET_KEY:MOMO_SECRET_KEY}
    endpoint: ${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
    refund-url: ${MOMO_REFUND_URL:https://test-payment.momo.vn/v2/gateway/api/refund}
    return-url: ${MOMO_RETURN_URL:http://localhost:8080/api/payments/momo-return}
    notify-url: ${MOMO_NOTIFY_URL:http://localhost:8080/api/system/payment/momo-ipn}

# Cấu hình Cloudinary
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
