name: Deployment Config CI

on:
  push:
    branches:
      - main
      - master
    paths:
      - ".env.example"
      - ".env.production.example"
      - "docker-compose*.yml"
      - "frontend/Dockerfile"
      - "frontend/nginx.conf"
      - "backend/electronics/Dockerfile"
      - ".github/workflows/deployment-config-ci.yml"
  pull_request:
    paths:
      - ".env.example"
      - ".env.production.example"
      - "docker-compose*.yml"
      - "frontend/Dockerfile"
      - "frontend/nginx.conf"
      - "backend/electronics/Dockerfile"
      - ".github/workflows/deployment-config-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-config-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment-config:
    name: Validate Docker Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production-like compose config
        run: docker compose --env-file .env.example config

      - name: Validate development compose config
        run: docker compose --env-file .env.example -f docker-compose.dev.yml config
